name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cp apps/server/.env.example apps/server/.env
      - run: npm run build
      - run: npm run test:e2e:install
      - run: npm run test:e2e
