services:
  - type: web
    name: monopoly-server
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: |
      npm ci &&
      npm run build:shared &&
      npm run build:server
    startCommand: node apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CLIENT_URL
        value: https://geea-develop.github.io
